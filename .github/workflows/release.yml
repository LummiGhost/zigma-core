name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Require matching package and tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e "const p=require('./package.json'); if(p.name!=='@zigma-ai/zigma-core'||'v'+p.version!==process.env.RELEASE_TAG) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - name: Verify CLI version
        run: test "$(node dist/cli.js --version)" = "$(node -p 'require("./package.json").version')"
      - name: Build package archive
        run: |
          npm pkg set repository.type=git repository.url=git+https://github.com/LummiGhost/zigma-core.git
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Publish package with trusted publishing
        run: npm publish ./*.tgz --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" ./*.tgz --verify-tag --generate-notes --title "$RELEASE_TAG"
